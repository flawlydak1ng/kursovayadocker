server {
    listen 80;
    server_name _;

    # Адрес API разрешается при каждом запросе: frontend может стартовать раньше api.
    resolver 127.0.0.11 valid=5s ipv6=off;

    location / {
        root /usr/share/nginx/html;
        index index.html;
    }

    location /api/ {
        set $upstream http://api:8000;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
